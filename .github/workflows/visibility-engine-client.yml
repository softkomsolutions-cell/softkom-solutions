name: Visibility Engine client
on:
  pull_request:
    paths: ['apps/visibility-engine-client/**', '.github/workflows/visibility-engine-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/visibility-engine-client
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: visibility_test
          POSTGRES_PASSWORD: ephemeral_test_database
          POSTGRES_DB: visibility_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://visibility_test:ephemeral_test_database@localhost:5432/visibility_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-test-secret-not-for-production-visibility
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/visibility-engine-client/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --omit=dev
